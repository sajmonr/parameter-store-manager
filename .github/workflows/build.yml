name: Build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # GitHub's macOS runners are Apple Silicon (arm64).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: ParameterStoreManager-mac-arm64
          path: release/*.dmg
          if-no-files-found: error
