name: Release

# On every push to main, release-please opens or updates a release PR that
# bumps the version and changelog. Merging that PR creates a draft GitHub
# Release and its tag; the publish job then builds the app, attaches the
# files and publishes the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Optional. With the default GITHUB_TOKEN the release PR does not
          # trigger the Build workflow, so it gets no build check.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run package

      - name: Attach files to the draft release
        run: |
          gh release upload "$TAG" --clobber \
            release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest
