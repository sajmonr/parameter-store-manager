name: Release

# On every push to main, release-please opens or updates a release PR that
# bumps the version and changelog. Merging that PR creates a draft GitHub
# Release and its tag; the build job then builds the app on macOS, Windows
# and Linux and attaches the files, and the publish job publishes the release
# once every platform has succeeded.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Optional. With the default GITHUB_TOKEN the release PR does not
          # trigger the Build workflow, so it gets no build check.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.os }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      # Let the other platforms finish so a re-run only repeats the failed one.
      fail-fast: false
      matrix:
        include:
          # The app reads latest-mac.yml, latest.yml or latest-linux.yml from
          # the latest release to tell users about new versions
          # (src/main/updates.js), so the manifests must stay attached.
          - os: macos-latest
            assets: release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml
          - os: windows-latest
            assets: release/*.exe release/*.blockmap release/latest.yml
          - os: ubuntu-latest
            assets: release/*.deb release/*.rpm release/*.AppImage release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      # electron-builder needs rpmbuild for the .rpm target.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci
      - run: npm test
      - run: npm run package

      - name: Attach files to the draft release
        run: gh release upload "$TAG" --clobber ${{ matrix.assets }}

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
